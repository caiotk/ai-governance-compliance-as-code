apiVersion: aigov/v1
kind: VendorPack
vendor: anthropic-claude
name: Anthropic Claude (Claude API / Claude Console / Claude Enterprise)
verified: '2026-10-13'
native_tools:
- name: Claude Admin API
  url: https://platform.claude.com/docs/en/manage-claude/admin-api
- name: Workspaces
  url: https://platform.claude.com/docs/en/manage-claude/workspaces
- name: Data residency (inference_geo, workspace geo)
  url: https://platform.claude.com/docs/en/manage-claude/data-residency
- name: Compliance API (Activity Feed)
  url: https://platform.claude.com/docs/en/manage-claude/compliance-api
- name: Usage and Cost API
  url: https://platform.claude.com/docs/en/manage-claude/usage-cost-api
- name: Rate Limits API
  url: https://platform.claude.com/docs/en/manage-claude/rate-limits-api
- name: API and data retention (ZDR, HIPAA readiness)
  url: https://platform.claude.com/docs/en/manage-claude/api-and-data-retention
- name: hashicorp/http (posture verification only; no official Anthropic provider)
  url: https://registry.terraform.io/providers/hashicorp/http/latest
attestations:
- name: SOC 2 Type I & Type II
  url: https://support.claude.com/en/articles/10015870-what-certifications-has-anthropic-obtained
  scope: Reports via the Trust Portal (trust.anthropic.com)
- name: ISO 27001:2022
  url: https://support.claude.com/en/articles/10015870-what-certifications-has-anthropic-obtained
  scope: Information Security Management
- name: ISO/IEC 42001:2023
  url: https://support.claude.com/en/articles/10015870-what-certifications-has-anthropic-obtained
  scope: AI Management Systems (announced 2025-01-13)
- name: HIPAA-ready configuration (BAA available)
  url: https://support.claude.com/en/articles/10015870-what-certifications-has-anthropic-obtained
  scope: Eligible orgs review/execute the BAA and enable HIPAA readiness in the Claude Console
policies:
- name: Usage Policy (AUP)
  url: https://www.anthropic.com/legal/aup
  effective: '2026-11-12'
  note: Replaces the version effective 2025-09-15 (https://www.anthropic.com/legal/archive/22742366-2ef0-4c7a-a833-6523f10d3944);
    the 2025-09-15 version applies until 2026-11-12
- name: Responsible Scaling Policy v3.4
  url: https://www.anthropic.com/responsible-scaling-policy
  effective: '2026-07-08'
implements:
- control: AIG-02
  summary: Workspace and active API-key inventory read from the Admin API; required workspaces asserted to exist; workspaces
    created idempotently by name.
  terraform:
  - terraform/main.tf#data.http.workspaces
  - terraform/main.tf#data.http.active_api_keys
  - terraform/main.tf#check.required_workspaces_exist
  - terraform/outputs.tf#workspace_inventory
  native:
  - native/admin-api.sh
- control: AIG-07
  summary: Key hygiene — active-key count threshold, stale-key (age) and no-expiry detection, no personal keys in service-account-only
    workspaces; stale keys disabled via status "inactive"; members added with least-privilege workspace roles. Workload Identity
    Federation (AWS, GitHub Actions, Google Cloud, Kubernetes, Entra ID, Okta, SPIFFE) is the recommended replacement for
    static keys.
  terraform:
  - terraform/main.tf#check.active_key_count_below_threshold
  - terraform/main.tf#check.no_stale_keys
  - terraform/main.tf#check.keys_have_expiry
  - terraform/main.tf#check.no_personal_keys_in_service_account_workspaces
  native:
  - native/admin-api.sh
- control: AIG-18
  summary: Inference and storage geography made explicit per workspace and per request; usage reports grouped by inference_geo
    provide transfer evidence.
  terraform:
  - terraform/main.tf#check.us_only_inference_geo
  - terraform/outputs.tf#workspace_inventory
  native:
  - native/data-residency.md
  - native/admin-api.sh
- control: AIG-13
  summary: Compliance API Activity Feed (GET /v1/compliance/activities, retained 6 years) exported to JSONL for the SIEM;
    usage and cost reports exported.
  terraform: []
  native:
  - native/compliance-activity-export.sh
  - native/admin-api.sh
- control: AIG-17
  summary: Workloads kept out of the Default Workspace (where spend/rate limits cannot be set) and required workspaces verified
    to have rate-limit overrides; workspace spend limits set in the Console.
  terraform:
  - terraform/main.tf#check.no_keys_in_default_workspace
  - terraform/main.tf#check.workspace_rate_limits_configured
  - terraform/main.tf#data.http.workspace_rate_limits
  native:
  - native/admin-api.sh
gaps:
- control: AIG-06
  note: No organization- or workspace-level model allow-list was found in the Admin API documentation (verified 2026-10-13).
    Enforce approved models in an API gateway or application config, or consume Claude via a cloud that has model-access policy
    (Vertex vertexai.allowedModels, Azure 'Foundry model deployments should only use approved models', Bedrock SCP on foundation-model
    ARNs).
- control: AIG-10
  note: Runtime guardrails and content filtering are the customer's responsibility on the first-party API. When Claude is
    consumed via Bedrock, Vertex AI or Microsoft Foundry, use those platforms' guardrails (Bedrock Guardrails, Model Armor,
    Azure content filters) — see the cloud packs.
- control: AIG-07
  note: API keys cannot be created through the Admin API (Console only); the API exposes created_at/expires_at but no last-used
    time, so staleness is approximated by age. Workspace spend and rate limits can only be written in the Console.
- control: AIG-17
  note: Workspace spend limits cannot be read or set through the documented Admin API for Console orgs (Spend Limits API is
    Claude Enterprise only); rate-limit overrides are readable but written in the Console. The Default Workspace cannot carry
    limits at all.
- control: AIG-18
  note: Workspace geo is 'us' only; there is no in-region storage for EU/AU/NZ on the first-party API — document the transfer
    mechanism (DPA/SCCs) or use a hyperscaler region.
- control: AIG-09
  note: CMEK (external_key_id via the External Keys API; AWS KMS, Azure Key Vault, Google Cloud KMS) exists but is not configured
    by this pack; eligibility per organization.
- control: AIG-02
  note: SCIM is documented for the Enterprise plan only (Team plan UNVERIFIED); IdP groups do not map to Claude roles.
- control: AIG-08
  note: No private network path to api.anthropic.com and workspace storage geo is currently US only; for NZ, AU, EU and LatAm
    users the first-party API is a cross-border transfer (see AIG-18), not network isolation. Consume Claude through Bedrock,
    Vertex or Foundry when private endpoints and in-region storage are required.
- control: AIG-05
  note: 'Personal-data protection is contractual and configurational rather than code: conversation content is not retained
    by default (Covered Models 30 days), ZDR is arranged through sales, and HIPAA readiness/BAA is enabled in the Console.
    Evidence these in the system record; PII filtering must be implemented in the application or the hosting cloud''s guardrails.'
