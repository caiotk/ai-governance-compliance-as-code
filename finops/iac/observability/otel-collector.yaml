# OpenTelemetry Collector for AI token telemetry — AIG-13, AIG-22.
# Receives OTLP from the LiteLLM broker (litellm_settings.callbacks: [otel]) and
# application SDKs emitting the GenAI semantic conventions, exposes Prometheus.
# Verified 2026-10-13 (docs/sources/finops-tooling.md §5.3): otlp receiver protocols
# grpc/http (4317/4318); prometheus exporter endpoint/namespace/const_labels/
# send_timestamps/metric_expiration. GenAI semconv (Development status) metric names:
# gen_ai.client.inference.usage.input_tokens / output_tokens / cache_read.input_tokens /
# cache_write.input_tokens / reasoning.output_tokens; attribute gen_ai.provider.name
# (gen_ai.system is deprecated).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Keep the attributes the FinOps dashboards group by; drop prompt content if any instrumentation sends it.
  attributes/finops:
    actions:
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.system_instructions
        action: delete

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: aigov
    const_labels:
      source: otel-collector
    send_timestamps: true
    metric_expiration: 180m

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [attributes/finops, batch]
      exporters: [prometheus]
