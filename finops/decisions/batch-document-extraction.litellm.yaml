# Generated by tools/select_model.py — LiteLLM proxy config implementing the routing decision.
# Verified keys (docs/sources/finops-tooling.md §1): model_list/litellm_params (model, api_key, api_base, api_version,
# tags, max_budget, budget_duration, input/output_cost_per_token), router_settings (fallbacks, context_window_fallbacks,
# default_fallbacks, provider_budget_config, enable_tag_filtering, model_group_alias, cooldown_time, allowed_fails,
# num_retries, enable_pre_call_checks), litellm_settings (callbacks, max_budget, budget_duration), general_settings.
# Not re-verified there: provider prefixes mistral/, deepseek/ and azure_ai/, aws_region_name, vertex_project/
# vertex_location, provider_budget_config keys bedrock/mistral/deepseek, and the custom model_info.tier/vendor/
# catalogue_id fields — taken from LiteLLM's provider pages; check against your LiteLLM version. Budgets need
# the proxy database. Tags are for spend attribution only (tag filtering is off).
model_list:
- model_name: batch-document-extraction-primary
  litellm_params:
    model: openai/gpt-6-luna
    api_key: os.environ/OPENAI_API_KEY
    tags:
    - workload:batch-document-extraction
    input_cost_per_token: 1.0e-07
    output_cost_per_token: 5.0e-07
    max_budget: 7200.0
    budget_duration: 30d
  model_info:
    id: batch-document-extraction-primary--openai-gpt-6-luna-on-openai
    tier: daily-driver
    vendor: openai
    catalogue_id: openai/gpt-6-luna@openai
- model_name: batch-document-extraction-fallback-1
  litellm_params:
    model: azure/gpt-6-luna
    api_base: os.environ/AZURE_API_BASE
    api_version: os.environ/AZURE_API_VERSION
    api_key: os.environ/AZURE_API_KEY
    tags:
    - workload:batch-document-extraction
    input_cost_per_token: 1.0e-07
    output_cost_per_token: 5.0e-07
    max_budget: 2160.0
    budget_duration: 30d
  model_info:
    id: batch-document-extraction-fallback-1--openai-gpt-6-luna-on-azure-foundry
    tier: daily-driver
    vendor: openai
    catalogue_id: openai/gpt-6-luna@azure-foundry
- model_name: batch-document-extraction-fallback-2
  litellm_params:
    model: bedrock/anthropic.claude-haiku-5-5
    aws_region_name: os.environ/AWS_REGION_NAME
    tags:
    - workload:batch-document-extraction
    input_cost_per_token: 1.0e-07
    output_cost_per_token: 5.0e-07
    max_budget: 2160.0
    budget_duration: 30d
  model_info:
    id: batch-document-extraction-fallback-2--anthropic-claude-haiku-5-5-on-aws-bedrock
    tier: daily-driver
    vendor: anthropic
    catalogue_id: anthropic/claude-haiku-5-5@aws-bedrock
router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 30
  fallbacks:
  - batch-document-extraction-primary:
    - batch-document-extraction-fallback-1
    - batch-document-extraction-fallback-2
  context_window_fallbacks: []
  default_fallbacks:
  - batch-document-extraction-fallback-1
  model_group_alias:
    batch-document-extraction: batch-document-extraction-primary
  provider_budget_config:
    openai:
      budget_limit: 7200.0
      time_period: 30d
    azure:
      budget_limit: 7200.0
      time_period: 30d
    bedrock:
      budget_limit: 7200.0
      time_period: 30d
litellm_settings:
  callbacks:
  - prometheus
  - otel
  max_budget: 6000
  budget_duration: 30d
  prometheus_initialize_budget_metrics: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  background_health_checks: true
  health_check_interval: 300
  alerting:
  - slack
  alert_types:
  - budget_alerts
  - llm_exceptions
  - cooldown_deployment
  - region_outage_alerts
  reject_clientside_metadata_tags: true
  enforce_fallback_model_access: true
