# Generated by tools/select_model.py — LiteLLM proxy config implementing the routing decision.
# Verified keys (docs/sources/finops-tooling.md §1): model_list/litellm_params (model, api_key, api_base, api_version,
# tags, max_budget, budget_duration, input/output_cost_per_token), router_settings (fallbacks, context_window_fallbacks,
# default_fallbacks, provider_budget_config, enable_tag_filtering, model_group_alias, cooldown_time, allowed_fails,
# num_retries, enable_pre_call_checks), litellm_settings (callbacks, max_budget, budget_duration), general_settings.
# Not re-verified there: provider prefixes mistral/, deepseek/ and azure_ai/, aws_region_name, vertex_project/
# vertex_location, provider_budget_config keys bedrock/mistral/deepseek, and the custom model_info.tier/vendor/
# catalogue_id fields — taken from LiteLLM's provider pages; check against your LiteLLM version. Budgets need
# the proxy database. Tags are for spend attribution only (tag filtering is off).
model_list:
- model_name: dispatch-advisor-primary
  litellm_params:
    model: bedrock/anthropic.claude-sonnet-5-5
    aws_region_name: os.environ/AWS_REGION_NAME
    tags:
    - workload:dispatch-advisor
    - sector:energy
    input_cost_per_token: 2.0e-06
    output_cost_per_token: 1.0e-05
    max_budget: 14400.0
    budget_duration: 30d
  model_info:
    id: dispatch-advisor-primary--anthropic-claude-sonnet-5-5-on-aws-bedrock
    tier: workhorse
    vendor: anthropic
    catalogue_id: anthropic/claude-sonnet-5-5@aws-bedrock
- model_name: dispatch-advisor-fallback-1
  litellm_params:
    model: vertex_ai/claude-sonnet-5-5
    vertex_project: os.environ/VERTEX_PROJECT
    vertex_location: os.environ/VERTEX_LOCATION
    tags:
    - workload:dispatch-advisor
    - sector:energy
    input_cost_per_token: 2.0e-06
    output_cost_per_token: 1.0e-05
    max_budget: 4320.0
    budget_duration: 30d
  model_info:
    id: dispatch-advisor-fallback-1--anthropic-claude-sonnet-5-5-on-gcp-vertex
    tier: workhorse
    vendor: anthropic
    catalogue_id: anthropic/claude-sonnet-5-5@gcp-vertex
router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 30
  fallbacks:
  - dispatch-advisor-primary:
    - dispatch-advisor-fallback-1
  context_window_fallbacks: []
  default_fallbacks:
  - dispatch-advisor-fallback-1
  model_group_alias:
    dispatch-advisor: dispatch-advisor-primary
  provider_budget_config:
    bedrock:
      budget_limit: 14400.0
      time_period: 30d
    vertex_ai:
      budget_limit: 14400.0
      time_period: 30d
litellm_settings:
  callbacks:
  - prometheus
  - otel
  max_budget: 12000
  budget_duration: 30d
  prometheus_initialize_budget_metrics: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  background_health_checks: true
  health_check_interval: 300
  alerting:
  - slack
  alert_types:
  - budget_alerts
  - llm_exceptions
  - cooldown_deployment
  - region_outage_alerts
  reject_clientside_metadata_tags: true
  enforce_fallback_model_access: true
