router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 30
  fallbacks:
  - eu-support-chatbot-primary:
    - eu-support-chatbot-fallback-1
    - eu-support-chatbot-escalation
  - eu-support-chatbot-escalation:
    - eu-support-chatbot-specialist
  context_window_fallbacks: []
  default_fallbacks:
  - eu-support-chatbot-fallback-1
  model_group_alias:
    eu-support-chatbot: eu-support-chatbot-primary
  provider_budget_config:
    openai:
      budget_limit: 18000.0
      time_period: 30d
    mistral:
      budget_limit: 18000.0
      time_period: 30d
litellm_settings:
  callbacks:
  - prometheus
  - otel
  max_budget: 15000
  budget_duration: 30d
  prometheus_initialize_budget_metrics: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  background_health_checks: true
  health_check_interval: 300
  alerting:
  - slack
  alert_types:
  - budget_alerts
  - llm_exceptions
  - cooldown_deployment
  - region_outage_alerts
  reject_clientside_metadata_tags: true
  enforce_fallback_model_access: true
