    vendor: openai
    vendor_pack: openai
    name: GPT-6 Astra
    tier: specialist-reasoning
    lifecycle: { status: ga, retirement: null, notice: "GA models >= 6 months (deprecations page)" }
    price_usd_per_1m: { input: 10.00, cached_input: 1.00, cache_write: 12.50, output: 50.00 }
    long_context: { threshold_input_tokens: 272000, input_multiplier: 2.0, output_multiplier: 1.5 }
    discounts: { batch: 0.5, flex: 0.5 }
    premiums: { fast: 2.0, ultrafast: 6.0, regional_processing: 1.1 }
    context_window: 1050000
    max_output: 128000
    capabilities: [text, vision, tools, structured_output, reasoning, computer_use]
    residency: { processing: [global, us, eu], storage: [us, eu, au, ca, jp, in, sg, kr, gb, ae], notes: "Regional processing verified for US and EU only (UAE conflicting across vendor pages); Fast mode not available with EU residency; regional endpoints +10%" }
    rai:
      attestations: [SOC 2 Type 2, ISO/IEC 27001:2022, ISO/IEC 27017:2015, ISO/IEC 27018:2019, ISO/IEC 27701:2019, ISO/IEC 42001:2023, HIPAA BAA (API)]
      zdr: on_approval
      moderation_api: true
      notes: "ZDR/MAM need prior approval; stateful endpoints are not ZDR-eligible (openai pack AIG-05)."
    platforms:
      - { platform: openai, model_id: gpt-6-astra }
