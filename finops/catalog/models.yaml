# ─────────────────────────────────────────────────────────────────────────────
# Model catalogue for the AI FinOps selector (tools/select_model.py).
#
# Prices are USD per 1M tokens at the vendor's first-party STANDARD rate for
# the global/default endpoint, copied as printed on the vendor page cited in
# `sources` on 2026-10-13 (docs/sources/finops-models.md). Regional, data-zone,
# fast/priority and batch rates are expressed as multipliers so the selector can
# price a workload in any mode. `tier` is THIS REPOSITORY'S functional
# classification (see `tiers`), not a vendor label. Quality is never asserted
# here: accuracy comes from the organisation's own evaluations recorded in the
# workload profile (AIG-14); without them the selector uses tier priors and says so.
# `rai` facts come from the vendor packs in vendors/*/mapping.yaml; anything not
# read on a vendor page is "unverified" and treated as absent by the selector.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: aigov/v1
kind: ModelCatalog
asOf: "2026-10-13"
currency: USD
tiers:
  daily-driver:
    description: Cheapest tier that still supports tools and structured output; high-volume, low-stakes, latency-sensitive work (classification, extraction, routing, simple chat).
    quality_prior: 0.60
    latency_class: fast
  workhorse:
    description: Default production tier for most assistive and agentic tasks; balanced cost, context and capability.
    quality_prior: 0.80
    latency_class: medium
  specialist-reasoning:
    description: Flagship/reasoning models for hard, consequential or long-horizon tasks; escalation target in a cascade, not a default.
    quality_prior: 0.95
    latency_class: slow
  specialist-code:
    description: Code-specialised models (completion, FIM, refactoring).
    quality_prior: 0.85
    latency_class: medium
  safety:
    description: Moderation / guardrail classifiers; never a primary model.
    quality_prior: 0.80
    latency_class: fast

# Platform overlays: when a model is served through a cloud platform, the
# platform's residency options, guardrails and attestations apply on top of the
# model's own. Verified from the cloud vendor packs (vendors/*/mapping.yaml) and
# docs/sources/finops-bcp-dr.md. Bedrock geo profiles differ per model — verify
# with GetInferenceProfile from each source Region before relying on `processing`.
# Residency semantics in the selector: a first-party platform uses the model's own
# `residency.processing`; a cloud platform uses the per-model platform entry
# (`processing`, or geos derived from `inference_profiles` prefixes) — never the
# overlay alone, because availability differs per model. A platform entry with no
# processing information is admissible only when the workload has no residency
# constraint. `zdr` is per platform too: a vendor's first-party ZDR says nothing
# about the cloud platform's retention.
platforms:
  openai:        { moderation_api: true, zdr: on_approval }
  anthropic:     { moderation_api: false, zdr: on_request }
  azure-foundry: { moderation_api: true, zdr: unverified, attestations: ["ISO/IEC 42001:2023"], notes: "GlobalStandard any region; DataZoneStandard US/EU/APAC (1.1x); Standard = customer geography; retention/abuse-monitoring terms not read for this catalogue" }
  aws-bedrock:   { moderation_api: true, zdr: unverified, attestations: ["ISO/IEC 42001:2023"], notes: "geo profiles us./eu./apac./au./jp./in.; in-region via bare model id (bedrock-mantle); Bedrock Guardrails; data-retention terms not read for this catalogue" }
  gcp-vertex:    { moderation_api: true, zdr: unverified, attestations: ["ISO/IEC 42001:2023"], notes: "global endpoint = no residency; jurisdictional us/eu and locational endpoints keep ML processing in-region; Model Armor" }
  gemini-api:    { moderation_api: true, zdr: unverified }
  mistral:       { moderation_api: true, zdr: on_request }
  deepseek:      { moderation_api: false, zdr: unverified }

models:
  # ── OpenAI ────────────────────────────────────────────────────────────────
