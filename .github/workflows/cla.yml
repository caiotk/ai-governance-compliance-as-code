# Contributor Licence Agreement check. On a contributor's first pull request the
# bot asks them to sign CLA.md by commenting the sentence below; signatures are
# stored in the `signatures` branch of this repository. Maintainers listed in
# allowlist do not need to sign.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/caiotk/ai-governance-compliance-as-code/blob/main/CLA.md
          branch: signatures
          allowlist: caiotk,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: "Thank you for contributing. Before this pull request can be merged, please read [CLA.md](https://github.com/caiotk/ai-governance-compliance-as-code/blob/main/CLA.md) and sign by replying with the sentence below. You keep all rights to your contribution; the agreement grants the project a copyright and patent licence so your work can ship in every edition."
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
