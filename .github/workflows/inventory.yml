# Builds the AI system inventory from systems/*.yaml on every change and weekly,
# publishes it as a job summary and a downloadable artefact, and on main keeps
# docs/INVENTORY.md committed so the inventory is readable from the repository.
name: AI inventory

on:
  push:
    branches: [main]
    paths: ["systems/**", "incidents/**", "catalog/**", "mlops/**", "tools/inventory.py"]
  pull_request:
    paths: ["systems/**", "incidents/**"]
  schedule:
    - cron: "17 20 * * 0"   # Mondays 09:17 NZDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml==6.0.3" "jsonschema==4.23.0"
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: "1.21.2"
      - name: Build the inventory
        run: python3 tools/inventory.py --out-dir build/inventory --summary
      - uses: actions/upload-artifact@v4
        with:
          name: ai-inventory
          path: build/inventory/
      - name: Commit docs/INVENTORY.md on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cp build/inventory/INVENTORY.md docs/INVENTORY.md
          if git diff --quiet -- docs/INVENTORY.md; then echo "Inventory unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INVENTORY.md
          git commit -m "Update AI inventory"
          git push
