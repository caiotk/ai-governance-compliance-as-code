# The MLOps governance gate. Runs on any change to an AI system record and can
# be called from other repositories' model pipelines:
#
#   jobs:
#     governance:
#       uses: caiotk/ai-governance-compliance-as-code/.github/workflows/ai-governance-gate.yml@v1
#       with:
#         systems: "ai-systems/*.yaml"
#         # policy_repo: my-org/my-fork   # forks: evaluate against your own copy
#         # policy_ref: v1.0.0           # pin the catalogue version
#
# A record with any "deny" finding fails the job, so the model cannot be
# promoted. Findings are also uploaded as SARIF, so they appear in the
# repository's Security → Code scanning tab and as pull-request annotations.
name: AI governance gate

on:
  pull_request:
    paths:
      - "systems/**"
      - "mlops/**"
      - "catalog/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      systems:
        description: Glob of AI system records to evaluate
        type: string
        default: "systems/*.yaml"
      policy_repo:
        description: Repository holding the catalogue and policies (owner/name)
        type: string
        default: caiotk/ai-governance-compliance-as-code
      policy_ref:
        description: Git ref (tag, branch or SHA) of the policy repository
        type: string
        default: main
      upload_sarif:
        description: Upload findings to GitHub code scanning (needs security-events write)
        type: boolean
        default: true
    outputs:
      result:
        description: allow or deny
        value: ${{ jobs.gate.outputs.result }}

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.gate.outputs.result }}
    steps:
      - name: Check out the caller's repository
        uses: actions/checkout@v4

      - name: Check out the policy repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.policy_repo || github.repository }}
          ref: ${{ inputs.policy_ref || github.sha }}
          path: .aigov

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install "pyyaml==6.0.3" "jsonschema==4.23.0"

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: "1.21.2"

      - name: Evaluate AI system records
        id: gate
        shell: bash
        env:
          SYSTEMS: ${{ inputs.systems || 'systems/*.yaml' }}
        run: |
          shopt -s nullglob
          files=( $SYSTEMS )
          if [ ${#files[@]} -eq 0 ]; then
            # Nothing to evaluate yet: demonstrate the gate on the bundled examples.
            python3 .aigov/tools/gate.py --markdown gate.md --sarif gate.sarif .aigov/mlops/examples/compliant/*.yaml
            echo "result=allow" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 .aigov/tools/gate.py --markdown gate.md --sarif gate.sarif "${files[@]}"
          rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          echo "result=$([ "$rc" = 0 ] && echo allow || echo deny)" >> "$GITHUB_OUTPUT"

      - name: Upload findings to code scanning
        if: (inputs.upload_sarif != false) && hashFiles('gate.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gate.sarif
          category: ai-governance-gate
        continue-on-error: true

      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('gate.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --edit-last --body-file gate.md || gh pr comment "$PR" --body-file gate.md

      - name: Enforce the gate
        if: steps.gate.outputs.exit != '' && steps.gate.outputs.exit != '0'
        run: |
          echo "::error title=AI governance gate::One or more AI systems have blocking findings. See the job summary."
          exit 1
