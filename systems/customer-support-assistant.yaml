# Example AI system record. Copy this file, rename it to your system's id, and
# complete every field; the gate (tools/gate.py) evaluates every record in this
# directory on pull requests, the inventory workflow lists them, and the review
# reminders open issues when evidence, assessments, audits or drills fall due.
#
# This example: a New Zealand technology company's customer-support assistant
# that answers questions from a product knowledge base (RAG), handles personal
# data, is user-facing and generative, but takes no consequential decisions.
apiVersion: aigov/v1
kind: AISystem
metadata:
  id: customer-support-assistant
  name: Customer support assistant
  owner: head.of.support@example.com
  business_unit: Customer operations
context:
  countries: [NZ]
  sector: tech
  role: deployer
  public_body: false
  entity_types: []
  evaluation_date: "2026-10-14"
system:
  purpose: Answers customer questions from the product knowledge base and drafts replies for support agents to send.
  decision_impact: assistive
  fully_automated_decision: false
  annex_iii_area: null
  user_facing: true
  generative: true
  generates_synthetic_content: false
  agentic: false
  irreversible_actions: false
  critical_operation: false
  model: { vendor: aws-bedrock, model_id: anthropic.claude-sonnet-4-5, hosting_region: ap-southeast-2 }
governance:
  policy_approved: true
  registered_in_inventory: true
  accountable_executive: chief.customer.officer@example.com
  ai_literacy_training: true
  risk_tolerance_defined: true
  internal_audit: { programme: true, last_audit: "2026-05-12", findings_tracked: true }
risk:
  classification: limited
  impact_assessment: { completed: true, method: "ISO/IEC 42005:2025", review_date: "2027-05-12", interested_parties_identified: true }
  dpia: { completed: true }
data:
  personal_data: true
  special_category: false
  provenance_documented: true
  lawful_basis: "Privacy Act 2020 IPP 1–4; collected directly for support purposes"
  cross_border_transfer: true
  transfer_mechanism: "Processing in AWS ap-southeast-2 (Sydney): IPP 12(1)(f) contractual comparable safeguards"
  indirect_collection: false
model: { approved: true }
supplier:
  assessed: true
  no_training_on_customer_data: true
  outsourced: true
  material_service_provider: false
  ai_bom: true
security:
  local_auth_disabled: true
  managed_identity: true
  least_privilege: true
  private_network: true
  data_residency_region: ap-southeast-2
  cmk: true
runtime: { content_filters: true, prompt_attack_detection: true, pii_filtering: true, guardrail_enforced_centrally: true, output_validation: true }
oversight: { human_in_the_loop: true, override_and_stop: true, contest_and_review: true }
transparency: { ai_disclosure: true, privacy_policy_adm_disclosure: true }
logging: { invocation_logging: true, retention_days: 400, siem_integrated: true }
monitoring: { drift_and_bias: true }
testing:
  evaluation_completed: true
  red_team_completed: true
  bias_assessment: true
  threat_model: { completed: true, references: [OWASP-LLM-2026, MITRE-ATLAS-2026.09] }
lifecycle: { versioned: true, promotion_gate: true }
incident: { runbook: true, notification_matrix: ["OPC:notifiable-breach", "CERT-NZ"], lessons_learned: true }
resilience: { tolerance_levels_set: true, fallback_tested: true, exit_plan: true, backup_capability: true, secondary_route: true, last_dr_drill: "2026-07-30", rto_minutes: 60, rpo_minutes: 15 }
finops:
  budget_defined: true
  monthly_budget_usd: 4000
  expected_monthly_usd: 2600
  token_limits_enforced: true
  cost_allocation_tags: [workload:customer-support-assistant, cost-centre:CO-110]
  model_selection_record: finops/decisions/customer-support-assistant.decision.json
  model_selection_date: "2026-09-20"
# Evidence as code: where the proof for each required control lives and when it
# was last reviewed. `make reviews` lists items expiring in the next 30 days;
# set enforce: true once every item is maintained, so expired evidence blocks
# promotion.
evidence:
  enforce: false
  default_valid_days: 365
  items:
    - { control: AIG-01, type: policy,      ref: "POL-AI-001 AI use policy v3",                      date: "2026-04-02", owner: ciso@example.com }
    - { control: AIG-02, type: link,        ref: "docs/INVENTORY.md",                                date: "2026-10-14" }
    - { control: AIG-03, type: document,    ref: "AIA-2026-014 AI impact assessment",                date: "2026-05-12", owner: privacy.officer@example.com }
    - { control: AIG-04, type: document,    ref: "DATA-KB-07 knowledge base data sheet",             date: "2026-05-12" }
    - { control: AIG-05, type: document,    ref: "PIA-2026-014 privacy impact assessment",           date: "2026-05-12", owner: privacy.officer@example.com }
    - { control: AIG-06, type: attestation, ref: "VEND-AWS-2026 vendor assessment; AI-BOM v2",       date: "2026-06-18", valid_days: 365 }
    - { control: AIG-07, type: config,      ref: "terraform/bedrock/iam.tf (least-privilege role)",  date: "2026-09-20" }
    - { control: AIG-08, type: config,      ref: "terraform/bedrock/network.tf (VPC endpoints)",     date: "2026-09-20" }
    - { control: AIG-09, type: config,      ref: "terraform/bedrock/kms.tf",                         date: "2026-09-20" }
    - { control: AIG-10, type: config,      ref: "Bedrock guardrail gr-support-v4; org BEDROCK_POLICY", date: "2026-09-20" }
    - { control: AIG-11, type: document,    ref: "RUN-SUP-02 agent review and stop procedure",       date: "2026-05-12" }
    - { control: AIG-12, type: screenshot,  ref: "chat widget AI disclosure banner",                 date: "2026-05-12" }
    - { control: AIG-13, type: log-export,  ref: "SIEM saved search bedrock-invocations",            date: "2026-09-20", valid_days: 90 }
    - { control: AIG-14, type: test-report, ref: "EVAL-2026-09 evaluation and red-team report",      date: "2026-09-10", valid_days: 180 }
    - { control: AIG-15, type: ticket,      ref: "CHG-4471 promotion gate in pipeline",              date: "2026-09-20" }
    - { control: AIG-16, type: document,    ref: "IR-AI-01 AI incident runbook",                     date: "2026-05-12" }
    - { control: AIG-17, type: document,    ref: "bcp/drills/2026-07-30-customer-support.md",        date: "2026-07-30" }
    - { control: AIG-18, type: document,    ref: "TRANSFER-AWS-SYD IPP 12 assessment",               date: "2026-05-12" }
    - { control: AIG-19, type: attestation, ref: "LMS course AI-LIT-1 completion report",            date: "2026-08-01" }
    - { control: AIG-20, type: test-report, ref: "BIAS-2026-09 output bias assessment",              date: "2026-09-10", valid_days: 180 }
    - { control: AIG-21, type: audit-report, ref: "IA-2026-05 internal audit of AI controls",        date: "2026-05-12" }
    - { control: AIG-22, type: config,      ref: "finops/decisions/customer-support-assistant.decision.json; AWS budget", date: "2026-09-20", valid_days: 90 }
