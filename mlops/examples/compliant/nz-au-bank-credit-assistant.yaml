# A trans-Tasman bank's credit-decision assistant: consequential, APRA-regulated
# and a BS11 registered bank. Fully evidenced — the gate should ALLOW it.
apiVersion: aigov/v1
kind: AISystem
metadata:
  id: credit-affordability-assistant
  name: Credit affordability assistant
  owner: head.of.credit.risk@example.com
  business_unit: Retail lending
context:
  countries: [NZ, AU]
  sector: fsi
  role: deployer
  public_body: false
  entity_types: [apra_regulated, nz_registered_bank]
  evaluation_date: "2026-10-13"
system:
  purpose: Summarises applicant financials and recommends an affordability outcome; a credit officer decides.
  decision_impact: consequential
  fully_automated_decision: false
  annex_iii_area: null
  user_facing: false
  generates_synthetic_content: false
  agentic: false
  irreversible_actions: false
  critical_operation: true
  model: { vendor: azure-foundry, model_id: gpt-5, hosting_region: australiaeast }
governance:
  policy_approved: true
  registered_in_inventory: true
  ai_literacy_training: true
risk:
  classification: high
  impact_assessment: { completed: true, date: "2026-08-01", method: ISO/IEC 42005 }
  dpia: { completed: true, date: "2026-08-01" }
data:
  personal_data: true
  special_category: false
  provenance_documented: true
  lawful_basis: contract
  cross_border_transfer: true
  transfer_mechanism: "NZ→AU processing: IPP 12(1)(f) contractual comparable safeguards; APP 8.1 contractual obligations"
  indirect_collection: true
model: { approved: true }
supplier:
  assessed: true
  no_training_on_customer_data: true
  material_service_provider: true
  register_entry: true
  outsourced: true
  regulator_access_assured: true
security:
  local_auth_disabled: true
  managed_identity: true
  least_privilege: true
  private_network: true
  data_residency_region: australiaeast
  cmk: true
runtime: { content_filters: true, prompt_attack_detection: true, pii_filtering: true, guardrail_enforced_centrally: true }
oversight: { human_in_the_loop: true, override_and_stop: true, contest_and_review: true }
transparency:
  ai_disclosure: true
  adm_notice: true
  adverse_decision_explanation: true
  privacy_policy_adm_disclosure: true
  indirect_collection_notice: true
logging: { invocation_logging: true, retention_days: 2555 }
monitoring: { drift_and_bias: true }
testing: { evaluation_completed: true, red_team_completed: true, bias_assessment: true }
lifecycle: { versioned: true, promotion_gate: true }
incident: { runbook: true, notification_matrix: ["APRA:72h", "OAIC:NDB", "OPC:notifiable-breach", "RBNZ"] }
resilience: { tolerance_levels_set: true, fallback_tested: true, exit_plan: true, backup_capability: true }
