# A Spanish public body's benefits chatbot built fast and shipped without
# governance. Annex III essential public services. The gate should DENY it.
apiVersion: aigov/v1
kind: AISystem
metadata:
  id: benefits-eligibility-chatbot
  name: Benefits eligibility chatbot
  owner: digital team
context:
  countries: [ES]
  sector: public
  role: deployer
  public_body: true
  entity_types: []
  evaluation_date: "2026-10-13"
system:
  purpose: Tells citizens whether they are eligible for a benefit and pre-fills the application.
  decision_impact: consequential
  fully_automated_decision: true
  annex_iii_area: essential_services
  user_facing: true
  generates_synthetic_content: true
  agentic: true
  irreversible_actions: false
  critical_operation: false
  model: { vendor: openai, model_id: unpinned, hosting_region: "" }
governance: { policy_approved: false, registered_in_inventory: false, ai_literacy_training: false }
risk: { classification: limited, impact_assessment: { completed: false } }
data:
  personal_data: true
  special_category: false
  provenance_documented: false
  cross_border_transfer: true
model: { approved: false }
supplier: { assessed: false }
security: { local_auth_disabled: false, least_privilege: false, private_network: false }
runtime: { content_filters: true, prompt_attack_detection: false, pii_filtering: false }
oversight: { human_in_the_loop: false }
transparency: { ai_disclosure: false }
logging: { invocation_logging: false, retention_days: 30 }
testing: { evaluation_completed: false }
lifecycle: { versioned: false, promotion_gate: false }
incident: { runbook: false }
