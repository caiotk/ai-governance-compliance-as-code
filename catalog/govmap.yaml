vendors:
  azure-foundry:    { symbol: Mf, lines: ["Microsoft Foundry", "Azure Policy"] }
  copilot-studio:   { symbol: Cs, lines: ["Copilot Studio", "DLP policies"] }
  aws-bedrock:      { symbol: Bk, lines: ["Amazon Bedrock", "Guardrails"] }
