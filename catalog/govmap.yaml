text:
  eyebrow: "NEXGUIDE.AI GOVERNANCE MAP · POLICY AS CODE · VERIFIED {asof}"
  title_accent: "NXGDAI-"
  title_rest: "GovMap"
  subtitle: "The NexGuide.AI Governance Map: {frameworks} laws, standards and frameworks, mapped to {controls} shared controls and implemented through {vendors} vendor policy packs."
  controls_strip: "▼ {controls} UNIFIED CONTROLS · AIG-01 … AIG-{last} — implement once, evidence against every framework it maps to"
  vendors_heading: "VENDOR PACKS"
  vendors_body: "Native governance tooling for {vendors_word} AI platforms, as Terraform plus each vendor's native IaC or admin API. Each pack maps to the controls above and lists its gaps."
  coverage_heading: "COVERAGE"
  coverage_line: "{countries} countries × {sectors} sectors = {profiles} compliance profiles"
  sectors: ["Health", "Financial services", "Public sector", "Agriculture", "Mining", "Technology", "Energy"]
  scopes: "BASE = organisational baseline that applies to every country and sector · ENERGY = energy-sector framework · MULTI = several national regimes"
  links: "links (top right) = controls a law or framework maps to · frameworks a control maps to · controls a vendor pack implements natively"
  footer_left: "github.com/caiotk/ai-governance-compliance-as-code"
  footer_right: "NXGDAI-GovMap · Every fact labelled primary, secondary or unverified · Not legal advice · Apache-2.0 · Caio Augusto Tkalec"
