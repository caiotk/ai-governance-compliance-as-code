      apra: ["AI letter: enforceable technical controls rather than policy alone"]
      nist-ai-rmf: ["MANAGE 4 response and recovery; AI 600-1 2.3 Dangerous, Violent, or Hateful Content, 2.8 Information Integrity, 2.9 Information Security"]
      owasp-genai: ["LLM01:2026 Prompt Injection", "LLM10:2026 Improper Output Handling", "LLM06:2026 Unbounded Consumption", "ASI01 Agent Goal Hijack", "ASI02 Tool Misuse and Exploitation", "ASI05 Unexpected Code Execution (RCE)"]
      mitre-atlas: ["AML.M0020 Generative AI Guardrails", "AML.M0030 Restrict AI Agent Tool Invocation on Untrusted Data", "AML.M0033 Input and Output Validation for AI Agent Components", "AML.M0004 Limit AI Service Query Volume and Rate", "AML.M0036 Limit AI Workload Resource Consumption", "AML.T0051 LLM Prompt Injection", "AML.T0054 LLM Jailbreak"]
      anthropic-zero-trust: ["eBook phase 4 defend against prompt injection; phase 5 secure tool access (deny-by-default tool allow-lists, parameter validation, rate limits, circuit breakers)", "Claude Code sandbox.enabled / failIfUnavailable / allowUnsandboxedCommands=false"]

  - id: AIG-11
