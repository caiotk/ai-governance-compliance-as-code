      iso27001: ["A.8.20 Networks security", "A.8.22 Segregation of networks"]
      gdpr: ["Arts 44–49 international transfers"]
      apra: ["CPS 234 paras 21–22 controls"]
      rbnz-bs11: ["Systems and data accessible to RBNZ and a statutory manager"]
      au-privacy: ["APP 8 cross-border disclosure"]
      nz-privacy: ["IPP 12 disclosure outside New Zealand"]
      eu-ai-act: ["Art 15 cybersecurity"]
      owasp-genai: ["ASI07 Insecure Inter-Agent Communication"]
      mitre-atlas: ["AML.M0032 Segmentation of AI Agent Components"]
      anthropic-zero-trust: ["CISO guide: egress allow-listing (strongest control against prompt injection)", "Claude Code sandbox.network.allowedDomains / allowManagedDomainsOnly", "eBook Enterprise tier: mutual TLS, sandboxed execution"]

  - id: AIG-09
    title: Encryption and key management
    objective: Data, fine-tuned weights and logs are encrypted at rest with customer-managed keys where the risk tier requires it.
    evidence: [security.cmk]
    mappings:
      iso27001: ["A.8.24 Use of cryptography"]
      gdpr: ["Art 32(1)(a) encryption"]
      apra: ["CPS 234 paras 21–22 controls"]
      zero-trust: ["CISA ZTMM: Data"]
