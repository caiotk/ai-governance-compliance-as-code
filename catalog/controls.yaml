      au-privacy: ["APP 11 security"]
      nz-privacy: ["IPP 5 storage and security"]
      mitre-atlas: ["AML.M0012 Encrypt Sensitive Information", "AML.M0005 Control Access to AI Models and Data at Rest"]
      anthropic-zero-trust: ["Advanced tier: hardware-backed identity, confidential computing", "Claude Code sandbox.credentials masking"]

  - id: AIG-10
