apiVersion: aigov/v1
kind: Jurisdiction
id: SG
name: Singapore
frameworks: [sg-pdpa]
sector_frameworks:
  energy: [energy-ci, iec62443, iso27019]
  fsi: [sg-mas-airm]
notes: No AI statute; model governance frameworks and sector guidelines. MAS AI Risk Management Guidelines were finalised in Oct 2026.
instruments:
  horizontal:
    - id: sg-mgf-genai
      name: Model AI Governance Framework for Generative AI
      citation: IMDA / AI Verify Foundation, May 2024
      status: voluntary
      url: https://morganlewis.com/pubs/2024/07/singapore-expands-its-ai-governance-approach-to-include-generative-ai
      verification: secondary
      controls: [AIG-01, AIG-06, AIG-10, AIG-12, AIG-14, AIG-16]
    - id: sg-mgf-agentic
      name: Model AI Governance Framework for Agentic AI
      citation: IMDA, 22 Jan 2026
      status: voluntary
      ai_relevance: Bound risks upfront; meaningful human accountability; technical controls across the lifecycle; end-user responsibility.
      url: https://www.mddi.gov.sg/newsroom/singapore-launches-new-model-ai-governance-framework-for-agentic-ai--/
      verification: primary
      controls: [AIG-03, AIG-07, AIG-10, AIG-11, AIG-13]
  data_protection:
    - id: sg-pdpa
      name: Personal Data Protection Act 2012 + Advisory Guidelines on Personal Data in AI Recommendation and Decision Systems
      citation: PDPA 2012; PDPC guidelines 1 Mar 2024
      status: in-force
      regulator: PDPC
      url: https://www.rajahtannasia.com/viewpoints/pdpc-issues-advisory-guidelines-on-use-of-personal-data-in-ai-recommendation-and-decision-systems/
      verification: secondary
      controls: [AIG-04, AIG-05, AIG-12, AIG-18]
  cyber:
    - id: sg-cybersecurity-act
      name: Cybersecurity Act 2018 as amended by the Cybersecurity (Amendment) Act 2024
      status: in-force
      effective: "Key provisions 2025-10-31"
      url: https://www.hlc.com/en/publications/provisions-in-singapores-cybersecurity-amendment-act-came-into-force-on-31-october-2025
      verification: secondary
      controls: [AIG-07, AIG-16]
  sectors:
    health:
      - id: sg-aihgle
        name: AI in Healthcare Guidelines 2.0 (MOH/HSA) and HSA Software Medical Devices life cycle guidelines
        citation: AIHGle 2.0, 10 Mar 2026; HSA guidelines R2, Apr 2022
        status: in-force
        url: https://www.bakermckenzie.com/en/insight/publications/2026/03/singapore-moh-and-hsa-launch-refreshed-ai-in-healthcare-guidelines
        verification: secondary
        controls: [AIG-01, AIG-11, AIG-14, AIG-15]
    fsi:
      - id: sg-mas-ai-rm
        name: MAS Guidelines on Artificial Intelligence Risk Management
        citation: Final, Oct 2026
        status: phased
        effective: "Sections 3–4 Oct 2027; sections 5–6 Oct 2028"
        ai_relevance: Board oversight, AI inventory and materiality assessment, lifecycle controls, accountability for third-party AI.
        url: https://www.mas.gov.sg/regulation/guidelines/guidelines-on-artificial-intelligence-risk-management-for-financial-institutions
        verification: primary
        controls: [AIG-01, AIG-02, AIG-03, AIG-06, AIG-13, AIG-14, AIG-15]
      - id: sg-mas-trm
        name: MAS Technology Risk Management Guidelines (2021) and FEAT principles (2018)
        status: in-force
        url: https://www.mas.gov.sg/regulation/guidelines/technology-risk-management-guidelines
        verification: unverified
        controls: [AIG-07, AIG-13, AIG-17, AIG-20]
    public:
      - id: sg-govtech
        name: GovTech responsible AI engineering practices and IM8 policy
        status: voluntary
        url: https://www.tech.gov.sg/technews/engineering-responsible-ai/
        verification: unverified
        controls: [AIG-10, AIG-14]
    agriculture:
      - id: sg-agri-none
        name: No AI-specific agricultural rule (small sector; SFA food safety regime)
        status: none
        url: https://www.mddi.gov.sg/newsroom/04122023/
        verification: secondary
        controls: [AIG-04]
    mining:
      - id: sg-mining-na
        name: Not applicable — no material mining sector (use the WSH Act generically)
        status: none
        url: https://www.mddi.gov.sg/newsroom/04122023/
        verification: secondary
        controls: [AIG-17]
    tech:
      - id: sg-copyright-s244
        name: Copyright Act 2021 s 244 computational data analysis exception (lawful access required)
        status: in-force
        url: https://www.reedsmith.com/articles/text-and-data-mining-in-singapore/
        verification: secondary
        controls: [AIG-04]
      - id: sg-online-safety
        name: Online Safety (Relief and Accountability) Act 2025 — Online Safety Commission from 29 Jun 2026
        status: in-force
        url: https://www.mlaw.gov.sg/online-safety-commission-and-online-safety-relief-and-accountability-act-2025-to-start-on-29-june-2026/
        verification: primary
        controls: [AIG-10, AIG-12]
    energy:
      - id: sg-cybersecurity-act-energy
        name: Cybersecurity Act 2018 as amended by Act 19 of 2024 — energy essential services (electricity generation/transmission/distribution; natural gas supply for generation); s 14 incident reporting incl. supplier systems; s 15 audit every 2 years and annual risk assessment; Part 3A third-party-owned CII
        regulator: CSA / EMA (sector lead)
        citation: "Act 9 of 2018; Act 19 of 2024 in operation 2025-10-31"
        status: in-force
        url: https://sso.agc.gov.sg/Act/CA2018
        verification: primary
        controls: [AIG-06, AIG-13, AIG-16, AIG-21]
      - id: sg-ccop-2026
        name: Cybersecurity Code of Practice for CII 2026 — risk framework (3.4), cloud restriction (3.9.3), outsourcing oversight (3.10), OT requirements (10), interconnected systems (12); board accountability clauses from 29 Jul 2027
        regulator: CSA
        citation: CCoP 2026 Release 1
        status: in-force-phased
        effective: "2026-07-29; new clauses by 2027-07-29"
        url: https://www.csa.gov.sg/legislation/codes-of-practice
        verification: primary
        ai_relevance: A cloud-hosted AI service that touches CII requires the 3.9.3 risk assessment first; no explicit AI clause.
        controls: [AIG-01, AIG-03, AIG-06, AIG-08, AIG-13, AIG-14, AIG-21]
      - id: sg-cii-regulations
        name: Cybersecurity (Critical Information Infrastructure) Regulations 2018 — prescribed incident-reporting period (2 hours, then details within 14 days)
        regulator: CSA
        citation: S 590/2018
        status: in-force
        url: https://sso.agc.gov.sg/SL/CA2018-S590-2018
        verification: secondary
        controls: [AIG-16]
      - id: sg-ema-acts
        name: Electricity Act 2001 and Gas Act 2001 (EMA licensing, Transmission Code, Market Rules)
        regulator: EMA
        status: in-force
        url: https://sso.agc.gov.sg/Act/EA2001
        verification: primary
        notes: EMA cyber codes and any AI guidance unverified.
        controls: [AIG-11, AIG-13]
