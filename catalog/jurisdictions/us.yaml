        regulator: NERC / FERC
        citation: 90 FR 28889, RM24-7-000
        status: phased
        effective: "2028-10-01 (CIP-015-2 2029-10-01)"
        url: https://www.federalregister.gov/documents/2025/07/02/2025-12309/critical-infrastructure-protection-reliability-standard-cip-015-1-cyber-security-internal-network
        verification: primary
        ai_relevance: East-west anomaly detection inside the CIP-networked environment — AI monitoring tools deployed for INSM are themselves in CIP scope.
        controls: [AIG-13]
      - id: us-ferc-912
