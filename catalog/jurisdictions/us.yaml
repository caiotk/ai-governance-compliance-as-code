    tech:
      - id: us-ftc-s5
        name: FTC Act §5 deception and unfairness enforcement on AI claims
        status: in-force
        url: https://www.hklaw.com/en/insights/media-entities/2026/09/the-federal-trade-commissions-current-approach-to-ai-regulation
        verification: secondary
        controls: [AIG-12, AIG-14]
    energy:
      - id: us-nerc-cip
        name: NERC CIP Reliability Standards (CIP-002 to CIP-014 currently enforceable; CIP-003-9 from 1 Apr 2026, CIP-012-2 from 1 Jul 2026)
        regulator: NERC / FERC
        citation: "CIP-002-5.1a, CIP-003-9, CIP-004-7, CIP-005-7, CIP-006-6, CIP-007-6, CIP-008-6, CIP-009-6, CIP-010-4, CIP-011-3, CIP-012-2, CIP-013-2, CIP-014-3"
        status: in-force
        effective: "virtualization suite (CIP-002-7/8, 003-10, 004-8, 005-8, 006-7.1, 007-7.1, 008-7.1, 009-7.1, 010-5, 011-4.1, 013-3) 2028-07-01; CIP-003-11 2029-07-01"
        url: https://www.nerc.com/standards/us-reliability-standards
        verification: primary
        ai_relevance: AI/ML software on BES Cyber Systems is subject to CIP-010 change management and vulnerability assessment, CIP-007 system security, CIP-011 information protection and CIP-013 supply-chain plans; CIP-005/012 constrain how analytics reach control centres.
        controls: [AIG-02, AIG-06, AIG-07, AIG-08, AIG-13, AIG-15, AIG-16]
      - id: us-nerc-cip-008
        name: NERC CIP-008-6 incident reporting (1 hour to E-ISAC and CISA; attempts by end of next calendar day)
        regulator: NERC
        citation: CIP-008-6 R4
        status: in-force
        effective: "2021-01-01"
        url: https://www.nerc.com/pa/Stand/Reliability%20Standards/CIP-008-6.pdf
        verification: primary
        controls: [AIG-16]
      - id: us-nerc-cip-015
