  - id: rbnz-bs11
    name: RBNZ BS11 Outsourcing Policy (registered banks)
    type: prudential-regulation
    scope: New Zealand — NZ-incorporated registered banks with liabilities (net of amounts owed to related parties) ≥ NZ$10bn
    issuer: Reserve Bank of New Zealand
    status: in-force
    applies_when: { entity_type: nz_registered_bank }
    notes: >-
      Current version issued Sep 2022. Expected to be replaced by the Deposit Takers Act outsourcing standard (exposure
      draft Jun 2026); DTA standards are due to be issued by 31 May 2027 and commence 1 Dec 2028, but the BS11 revocation
      date is not confirmed. RBNZ has issued no AI-specific guidance.
    url: https://www.rbnz.govt.nz/regulation-and-supervision/banks/prudential-requirements/outsourcing-policy
    verification: primary

  - id: au-privacy
    name: Australian Privacy Act 1988 (APPs) incl. POLA Act 2024
